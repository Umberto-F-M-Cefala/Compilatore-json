<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <meta name="theme-color" content="#121212">

    <meta
        name="description"
        content="AI Memory Compiler - Archivio personale locale e portabile"
    >

    <link rel="manifest" href="./manifest.json">

    <title>Memory Archive</title>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #3b82f6;
            --danger: #ef4444;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --border: #374151;
            --input: #262626;

            --font:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font);
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding-bottom: 70px;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;

            background: var(--bg);
            border-bottom: 1px solid var(--border);

            padding: 12px 16px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            z-index: 10;
        }

        header h1 {
            font-size: 1.1rem;
        }

        /* =========================
           FORM ELEMENTS
        ========================= */

        button,
        input,
        select,
        textarea {
            background: var(--input);
            color: var(--text);

            border: 1px solid var(--border);
            padding: 10px 12px;

            border-radius: 6px;

            font-size: 0.95rem;
            width: 100%;

            outline: 0;
        }

        button {
            cursor: pointer;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
        }

        /* =========================
           LAYOUT
        ========================= */

        .container {
            padding: 16px;
            max-width: 800px;
            margin: auto;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .filter-grid,
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        /* =========================
           ARCHIVE LIST
        ========================= */

        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 8px;

            padding: 14px;

            cursor: pointer;
        }

        .card:active {
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;

            gap: 10px;
            margin-bottom: 6px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .card-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;

            margin-top: 8px;
        }

        .badge {
            font-size: 0.7rem;

            padding: 2px 6px;

            border-radius: 4px;

            background: var(--border);

            text-transform: uppercase;
            font-weight: 600;
        }

        .badge-type {
            background: var(--accent);
            color: #fff;
        }

        /* =========================
           FLOATING ACTION BUTTON
        ========================= */

        .fab {
            position: fixed;

            right: 16px;
            bottom: 16px;

            width: 56px;
            height: 56px;

            border: 0;
            border-radius: 50%;

            background: var(--accent);
            color: #fff;

            font-size: 1.8rem;

            z-index: 9;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;
            inset: 0;

            background: #000d;

            z-index: 100;

            overflow-y: auto;

            padding: 16px;
        }

        .modal-content {
            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 8px;

            max-width: 700px;

            margin: 20px auto;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 16px;
        }

        .close-btn {
            width: auto;

            background: transparent;
            border: 0;

            font-size: 1.5rem;
            color: var(--muted);
        }

        /* =========================
           FORM GROUPS
        ========================= */

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;

            font-size: 0.8rem;
            color: var(--muted);

            margin-bottom: 4px;

            text-transform: uppercase;
        }

        .actions-row {
            display: flex;
            gap: 10px;

            margin-top: 20px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn-primary {
            background: var(--accent);
            color: #fff;

            border: 0;

            font-weight: 600;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;

            border: 0;

            font-weight: 600;
        }

        .btn-secondary {
            background: transparent;
        }

        /* =========================
           STATUS / EMPTY STATE
        ========================= */

        .archive-status {
            text-align: center;

            color: var(--muted);

            font-size: 0.7rem;

            margin-top: 10px;
        }

        .empty-state {
            text-align: center;

            color: var(--muted);

            padding: 40px 0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            header {
                gap: 8px;
                align-items: flex-start;
            }

            header h1 {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>
        <h1>MEMORY ARCHIVE</h1>

        <div style="display: flex; gap: 5px;">

            <button
                class="btn-secondary"
                onclick="newArchive()"
                style="padding: 4px 7px; font-size: 0.7rem;"
            >
                Nuovo
            </button>

            <button
                class="btn-secondary"
                onclick="openArchive()"
                style="padding: 4px 7px; font-size: 0.7rem;"
            >
                Apri
            </button>

            <button
                class="btn-secondary"
                onclick="saveArchive()"
                style="padding: 4px 7px; font-size: 0.7rem;"
            >
                Salva
            </button>

            <input
                id="importFile"
                type="file"
                accept=".json,application/json"
                hidden
                onchange="importArchive(event)"
            >

        </div>
    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <div class="controls">

            <input
                id="searchInput"
                placeholder="Cerca nel testo..."
                oninput="renderList()"
            >

            <div class="filter-grid">

                <!-- TYPE -->

                <select
                    id="filterType"
                    onchange="renderList()"
                >
                    <option value="">Tutti i Tipi</option>

                    <option value="decision">Decision</option>
                    <option value="experience">Experience</option>
                    <option value="thought">Thought</option>
                    <option value="lesson">Lesson</option>
                    <option value="rule">Rule</option>
                    <option value="project">Project</option>
                    <option value="goal">Goal</option>
                    <option value="note">Note</option>
                </select>


                <!-- STATUS -->

                <select
                    id="filterStatus"
                    onchange="renderList()"
                >
                    <option value="">Tutti gli Status</option>

                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="archived">Archived</option>
                    <option value="discarded">Discarded</option>
                </select>


                <!-- PRIORITY -->

                <select
                    id="filterPriority"
                    onchange="renderList()"
                >
                    <option value="">Tutte le Priorità</option>

                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>


                <!-- SORT -->

                <select
                    id="sortBy"
                    onchange="renderList()"
                >
                    <option value="date-desc">
                        Data (nuovi)
                    </option>

                    <option value="date-asc">
                        Data (vecchi)
                    </option>

                    <option value="title-asc">
                        Titolo (A-Z)
                    </option>
                </select>

            </div>
        </div>


        <!-- ARCHIVE LIST -->

        <div
            id="archiveList"
            class="archive-list"
        ></div>


        <!-- STATUS -->

        <div
            id="archiveStatus"
            class="archive-status"
        >
            Nessun archivio aperto
        </div>

    </main>


    <!-- =========================
         FLOATING BUTTON
    ========================= -->

    <button
        class="fab"
        onclick="openModal()"
    >
        +
    </button>


    <!-- =========================
         EDITOR MODAL
    ========================= -->

    <div
        id="editorModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Nuova Memoria
                </h2>

                <button
                    class="close-btn"
                    onclick="closeModal()"
                >
                    &times;
                </button>

            </div>


            <form
                id="memoryForm"
                onsubmit="saveMemory(event)"
            >

                <input
                    type="hidden"
                    id="recordId"
                >


                <!-- TYPE + DATE -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Tipo *</label>

                        <select
                            id="type"
                            required
                        >
                            <option value="decision">
                                Decision
                            </option>

                            <option value="experience">
                                Experience
                            </option>

                            <option value="thought">
                                Thought
                            </option>

                            <option value="lesson">
                                Lesson
                            </option>

                            <option value="rule">
                                Rule
                            </option>

                            <option value="project">
                                Project
                            </option>

                            <option value="goal">
                                Goal
                            </option>

                            <option
                                value="note"
                                selected
                            >
                                Note
                            </option>
                        </select>

                    </div>


                    <div class="form-group">

                        <label>Data *</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>

                </div>


                <!-- TITLE -->

                <div class="form-group">

                    <label>Titolo *</label>

                    <input
                        id="title"
                        placeholder="Es. Transizione a carriera indipendente"
                        required
                    >

                </div>


                <!-- CATEGORY + LANGUAGE -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Categoria</label>

                        <input
                            id="category"
                            placeholder="Carriera, Salute, Finanza"
                        >

                    </div>


                    <div class="form-group">

                        <label>Lingua</label>

                        <input
                            id="language"
                            value="it"
                        >

                    </div>

                </div>


                <!-- STATUS + PRIORITY -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Status</label>

                        <select id="status">

                            <option value="">
                                -- Seleziona --
                            </option>

                            <option value="active">
                                Active
                            </option>

                            <option value="completed">
                                Completed
                            </option>

                            <option value="archived">
                                Archived
                            </option>

                            <option value="discarded">
                                Discarded
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Priorità</label>

                        <select id="priority">

                            <option value="">
                                -- Seleziona --
                            </option>

                            <option value="low">
                                Low
                            </option>

                            <option value="medium">
                                Medium
                            </option>

                            <option value="high">
                                High
                            </option>

                            <option value="critical">
                                Critical
                            </option>

                        </select>

                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label>Descrizione</label>

                    <textarea
                        id="description"
                        rows="3"
                    ></textarea>

                </div>


                <!-- OBJECTIVE + PROBLEM -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Obiettivo</label>

                        <textarea
                            id="objective"
                            rows="3"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>Problema</label>

                        <textarea
                            id="problem"
                            rows="3"
                        ></textarea>

                    </div>

                </div>


                <!-- SOLUTION -->

                <div class="form-group">

                    <label>
                        Soluzione / Risultato
                    </label>

                    <textarea
                        id="solution"
                        rows="3"
                    ></textarea>

                </div>


                <!-- TASKS -->

                <div class="form-group">

                    <label>Tasks</label>

                    <input
                        id="tasks"
                        placeholder="Task 1, Task 2"
                    >

                </div>


                <!-- DECISIONS -->

                <div class="form-group">

                    <label>Decisioni</label>

                    <input
                        id="decisions"
                        placeholder="Scelta A invece di B"
                    >

                </div>


                <!-- RESOURCES -->

                <div class="form-group">

                    <label>Risorse</label>

                    <input
                        id="resources"
                        placeholder="Link, libri, persone"
                    >

                </div>


                <!-- TAGS -->

                <div class="form-group">

                    <label>Tags</label>

                    <input
                        id="tags"
                        placeholder="lavoro, 2026, strategie"
                    >

                </div>


                <!-- ACTIONS -->

                <div class="actions-row">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Salva Memoria
                    </button>

                    <button
                        type="button"
                        id="deleteBtn"
                        class="btn-danger"
                        style="display: none;"
                        onclick="deleteMemory()"
                    >
                        Elimina
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           ARCHIVE STATE
        ========================= */

        let archive = {
            format: "memory-archive",
            version: "1.0",
            created: null,
            updated: null,
            records: []
        };

        let currentFileHandle = null;
        let dirty = false;


        /* =========================
           HELPERS
        ========================= */

        const $ = id =>
            document.getElementById(id);


        const today = () =>
            new Date()
                .toISOString()
                .split("T")[0];


        const parseArray = value =>
            value
                ? value
                    .split(",")
                    .map(x => x.trim())
                    .filter(Boolean)
                : [];


        const joinArray = value =>
            Array.isArray(value)
                ? value.join(", ")
                : "";


        const esc = value =>
            value
                ? String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;")
                : "";


        /* =========================
           STATUS
        ========================= */

        function updateStatus() {

            $("archiveStatus").textContent =
                archive.records.length +
                " memorie • " +
                (
                    currentFileHandle
                        ? (
                            dirty
                                ? "Modifiche non salvate"
                                : "Salvato"
                        )
                        : "Archivio non salvato"
                );

        }


        /* =========================
           NORMALIZE RECORD
        ========================= */

        function normalize(r) {

            return {
                id: r.id,

                type: r.type,

                title: r.title,

                date: r.date,

                category: r.category || null,

                status: r.status || null,

                priority: r.priority || null,

                language: r.language || "it",

                description: r.description || null,

                objective: r.objective || null,

                problem: r.problem || null,

                solution: r.solution || null,

                tasks:
                    Array.isArray(r.tasks)
                        ? r.tasks
                        : [],

                decisions:
                    Array.isArray(r.decisions)
                        ? r.decisions
                        : [],

                resources:
                    Array.isArray(r.resources)
                        ? r.resources
                        : [],

                tags:
                    Array.isArray(r.tags)
                        ? r.tags
                        : []
            };

        }


        /* =========================
           NEW ARCHIVE
        ========================= */

        function newArchive() {

            if (
                dirty &&
                !confirm(
                    "Ci sono modifiche non salvate. Creare un nuovo archivio?"
                )
            ) {
                return;
            }

            archive = {
                format: "memory-archive",
                version: "1.0",
                created: today(),
                updated: today(),
                records: []
            };

            currentFileHandle = null;
            dirty = false;

            renderList();
        }


        /* =========================
           OPEN ARCHIVE
        ========================= */

        async function openArchive() {

            if (!("showOpenFilePicker" in window)) {

                $("importFile").click();

                return;
            }

            try {

                const [handle] =
                    await window.showOpenFilePicker({
                        types: [
                            {
                                description:
                                    "Memory Archive JSON",

                                accept: {
                                    "application/json":
                                        [".json"]
                                }
                            }
                        ]
                    });

                const file =
                    await handle.getFile();

                loadArchive(
                    JSON.parse(
                        await file.text()
                    )
                );

                currentFileHandle = handle;
                dirty = false;

                updateStatus();

            } catch (e) {

                if (e.name !== "AbortError") {

                    alert(
                        "Errore apertura archivio: " +
                        e.message
                    );

                }

            }

        }


        /* =========================
           LOAD ARCHIVE
        ========================= */

        function loadArchive(data) {

            if (
                !data ||
                data.format !== "memory-archive" ||
                data.version !== "1.0" ||
                !Array.isArray(data.records)
            ) {
                throw new Error(
                    "Formato memory-archive v1.0 non valido."
                );
            }

            archive = {

                format: "memory-archive",

                version: "1.0",

                created:
                    data.created || today(),

                updated:
                    data.updated || today(),

                records:
                    data.records
                        .filter(
                            r =>
                                r &&
                                r.id !== undefined &&
                                r.type &&
                                r.title &&
                                r.date
                        )
                        .map(normalize)

            };

            renderList();
        }


        /* =========================
           SAVE ARCHIVE
        ========================= */

        async function saveArchive() {

            archive.updated = today();

            const json =
                JSON.stringify(
                    archive,
                    null,
                    2
                );


            /*
             * Save directly to the
             * currently opened file.
             */

            if (
                currentFileHandle &&
                "createWritable" in currentFileHandle
            ) {

                try {

                    const writer =
                        await currentFileHandle
                            .createWritable();

                    await writer.write(json);

                    await writer.close();

                    dirty = false;

                    updateStatus();

                    return;

                } catch (e) {

                    alert(
                        "Errore salvataggio: " +
                        e.message
                    );

                    return;
                }

            }


            /*
             * Fallback:
             * download JSON file.
             */

            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "memory-archive-" +
                today() +
                ".json";

            link.click();

            URL.revokeObjectURL(url);

            dirty = false;

            updateStatus();
        }


        /* =========================
           IMPORT ARCHIVE
        ========================= */

        function importArchive(e) {

            const file =
                e.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();


            reader.onload = () => {

                try {

                    loadArchive(
                        JSON.parse(
                            reader.result
                        )
                    );

                    currentFileHandle = null;
                    dirty = false;

                    updateStatus();

                } catch (err) {

                    alert(
                        "Errore importazione: " +
                        err.message
                    );

                }

                e.target.value = "";
            };


            reader.readAsText(file);
        }


        /* =========================
           RENDER LIST
        ========================= */

        function renderList() {

            const search =
                $("searchInput")
                    .value
                    .toLowerCase();

            const type =
                $("filterType").value;

            const status =
                $("filterStatus").value;

            const priority =
                $("filterPriority").value;

            const sort =
                $("sortBy").value;


            let records =
                archive.records.filter(
                    r =>

                        (
                            !search ||
                            JSON.stringify(r)
                                .toLowerCase()
                                .includes(search)
                        )

                        &&

                        (
                            !type ||
                            r.type === type
                        )

                        &&

                        (
                            !status ||
                            r.status === status
                        )

                        &&

                        (
                            !priority ||
                            r.priority === priority
                        )
                );


            /* =========================
               SORT
            ========================= */

            records.sort((a, b) => {

                if (sort === "date-desc") {

                    return (
                        new Date(b.date) -
                        new Date(a.date)
                    );

                }


                if (sort === "date-asc") {

                    return (
                        new Date(a.date) -
                        new Date(b.date)
                    );

                }


                return a.title.localeCompare(
                    b.title
                );

            });


            /* =========================
               RENDER
            ========================= */

            $("archiveList").innerHTML =
                records.length

                    ? records
                        .map(
                            r => `

                                <div
                                    class="card"
                                    onclick="editMemory(${JSON.stringify(r.id)})"
                                >

                                    <div class="card-header">

                                        <span class="card-title">
                                            ${esc(r.title)}
                                        </span>

                                        <span class="card-date">
                                            ${esc(r.date)}
                                        </span>

                                    </div>


                                    ${
                                        r.description
                                            ? `
                                                <div
                                                    style="
                                                        font-size: 0.85rem;
                                                        color: var(--muted);
                                                    "
                                                >
                                                    ${esc(r.description)}
                                                </div>
                                            `
                                            : ""
                                    }


                                    <div class="card-badges">

                                        <span class="badge badge-type">
                                            ${esc(r.type)}
                                        </span>


                                        ${
                                            r.category
                                                ? `
                                                    <span class="badge">
                                                        ${esc(r.category)}
                                                    </span>
                                                `
                                                : ""
                                        }


                                        ${
                                            r.status
                                                ? `
                                                    <span class="badge">
                                                        ${esc(r.status)}
                                                    </span>
                                                `
                                                : ""
                                        }


                                        ${
                                            r.priority
                                                ? `
                                                    <span class="badge">
                                                        ${esc(r.priority)}
                                                    </span>
                                                `
                                                : ""
                                        }

                                    </div>

                                </div>

                            `
                        )
                        .join("")

                    : `
                        <div class="empty-state">
                            Nessuna memoria trovata.
                        </div>
                    `;


            updateStatus();
        }


        /* =========================
           OPEN MODAL
        ========================= */

        function openModal(edit = false) {

            $("editorModal")
                .style
                .display = "block";


            if (!edit) {

                $("memoryForm").reset();

                $("recordId").value = "";

                $("date").value = today();

                $("language").value = "it";

                $("modalTitle")
                    .textContent =
                    "Nuova Memoria";

                $("deleteBtn")
                    .style
                    .display = "none";
            }

        }


        /* =========================
           CLOSE MODAL
        ========================= */

        function closeModal() {

            $("editorModal")
                .style
                .display = "none";
        }


        /* =========================
           SAVE MEMORY
        ========================= */

        function saveMemory(e) {

            e.preventDefault();


            const id =
                $("recordId").value ||
                Date.now().toString();


            const record =
                normalize({

                    id,

                    type:
                        $("type").value,

                    title:
                        $("title")
                            .value
                            .trim(),

                    date:
                        $("date").value,

                    category:
                        $("category")
                            .value
                            .trim() || null,

                    status:
                        $("status").value ||
                        null,

                    priority:
                        $("priority").value ||
                        null,

                    language:
                        $("language")
                            .value
                            .trim() || "it",

                    description:
                        $("description")
                            .value
                            .trim() || null,

                    objective:
                        $("objective")
                            .value
                            .trim() || null,

                    problem:
                        $("problem")
                            .value
                            .trim() || null,

                    solution:
                        $("solution")
                            .value
                            .trim() || null,

                    tasks:
                        parseArray(
                            $("tasks").value
                        ),

                    decisions:
                        parseArray(
                            $("decisions").value
                        ),

                    resources:
                        parseArray(
                            $("resources").value
                        ),

                    tags:
                        parseArray(
                            $("tags").value
                        )

                });


            const index =
                archive.records.findIndex(
                    x =>
                        String(x.id) ===
                        String(id)
                );


            if (index >= 0) {

                archive.records[index] =
                    record;

            } else {

                archive.records.push(
                    record
                );

            }


            archive.updated = today();

            dirty = true;

            closeModal();

            renderList();
        }


        /* =========================
           EDIT MEMORY
        ========================= */

        function editMemory(id) {

            const record =
                archive.records.find(
                    x =>
                        String(x.id) ===
                        String(id)
                );


            if (!record) {
                return;
            }


            $("recordId").value =
                record.id;

            $("type").value =
                record.type;

            $("date").value =
                record.date;

            $("title").value =
                record.title || "";

            $("category").value =
                record.category || "";

            $("language").value =
                record.language || "it";

            $("status").value =
                record.status || "";

            $("priority").value =
                record.priority || "";

            $("description").value =
                record.description || "";

            $("objective").value =
                record.objective || "";

            $("problem").value =
                record.problem || "";

            $("solution").value =
                record.solution || "";

            $("tasks").value =
                joinArray(record.tasks);

            $("decisions").value =
                joinArray(record.decisions);

            $("resources").value =
                joinArray(record.resources);

            $("tags").value =
                joinArray(record.tags);


            $("modalTitle")
                .textContent =
                "Modifica Memoria";


            $("deleteBtn")
                .style
                .display = "block";


            openModal(true);
        }


        /* =========================
           DELETE MEMORY
        ========================= */

        function deleteMemory() {

            const id =
                $("recordId").value;


            if (
                !id ||
                !confirm(
                    "Sei sicuro di voler eliminare questa memoria?"
                )
            ) {
                return;
            }


            archive.records =
                archive.records.filter(
                    record =>
                        String(record.id) !==
                        String(id)
                );


            archive.updated = today();

            dirty = true;

            closeModal();

            renderList();
        }


        /* =========================
           SERVICE WORKER
        ========================= */

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./sw.js")
                        .catch(console.warn);

                }
            );

        }


        /* =========================
           INITIAL RENDER
        ========================= */

        renderList();

    </script>

</body>

  </html>
